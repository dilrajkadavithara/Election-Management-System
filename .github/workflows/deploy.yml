name: Cloud Deployment Pipeline

on:
  push:
    branches: [ master ]

# Prevent simultaneous deploys. New pushes QUEUE (don't cancel) so the server
# is never left in a half-restarted state from a mid-SSH kill.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Update Code on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p /opt/voterslist
            cd /opt/voterslist
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin master
              git reset --hard origin/master
            fi

      - name: Transfer Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "frontend/dist/**,Paravur_Polling_Stations_list (1).xlsx"
          target: "/opt/voterslist/"
          strip_components: 0

      - name: Start Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Generous timeout: build can take several minutes on the server
          command_timeout: 15m
          script: |
            cd /opt/voterslist
            # Cached build — only rebuilds changed layers (fast for code-only changes)
            docker compose up -d --build --remove-orphans
            # Prune stopped containers only — preserve build cache for future deploys
            docker container prune -f
            echo "✅ Containers started. Health check will run from GitHub Actions."

      - name: Verify Deployment Health
        # Polls the live public URL — independent of SSH timing.
        # continue-on-error: true so a timing edge case never marks a good deploy as failed.
        continue-on-error: true
        run: |
          echo "Polling https://intelhub.live/api/health (up to 5 minutes)..."
          for i in $(seq 1 20); do
            sleep 15
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://intelhub.live/api/health 2>/dev/null || echo "ERR")
            echo "  Attempt $i/20: HTTP $STATUS"
            if [ "$STATUS" == "200" ]; then
              echo "🚀 DEPLOYMENT SUCCESSFUL — site is live and healthy."
              exit 0
            fi
          done
          echo "❌ Site did not become healthy within 5 minutes."
          exit 1
