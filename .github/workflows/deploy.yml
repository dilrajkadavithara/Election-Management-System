name: Tank Deployment Pipeline (GHCR Optimized)

on:
  push:
    branches: [ master ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/voter-vault:latest
            ghcr.io/${{ github.repository_owner }}/voter-vault:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Tank via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            mkdir -p /opt/voterslist
            cd /opt/voterslist

            # 1. Update orchestration file (only Pulls, no local builds)
            if [ ! -f "docker-compose.remote.yml" ]; then
                # Fetch only the compose file if it doesn't exist
                curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                     -L https://raw.githubusercontent.com/${{ github.repository }}/master/docker-compose.remote.yml \
                     -o docker-compose.remote.yml
            fi

            # 2. Re-pull the logic files (excluding sensitive .env)
            git fetch origin master && git reset --hard origin/master

            # 3. Pull the pre-built optimized image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.remote.yml pull

            # 4. Swap and Clean
            docker compose -f docker-compose.remote.yml up -d --remove-orphans
            docker image prune -f
            
            echo "🚀 TANK DEPLOYMENT COMPLETE. App is now running at ultra-speed."
