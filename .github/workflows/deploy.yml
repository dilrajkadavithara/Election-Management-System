name: Cloud Deployment Pipeline

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Update Code on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p /opt/voterslist
            cd /opt/voterslist
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin master
              git reset --hard origin/master
            fi

      - name: Transfer Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "frontend/dist/"
          target: "/opt/voterslist/frontend/dist/"
          strip_components: 2

      - name: Start Application & Verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/voterslist
            docker compose down --remove-orphans
            docker compose up -d --build
            
            echo "Waiting for services to initialize (45 seconds)..."
            sleep 45
            
            echo "--- DOCKER STATUS ---"
            docker compose ps
            
            echo "--- VERIFYING HEALTH ---"
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || echo "FAILED")
            
            if [ "$HEALTH" == "200" ] || [ "$HEALTH" == "301" ] || [ "$HEALTH" == "302" ]; then
              echo "🚀 DEPLOYMENT SUCCESSFUL: Site is responding with $HEALTH"
              docker system prune -f
            else
              echo "❌ DEPLOYMENT FAILURE: Site returned $HEALTH. Printing logs..."
              docker compose logs --tail=50
              exit 1
            fi
