name: Tank Deployment Pipeline (GHCR Optimized)

on:
  push:
    branches: [ master ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push App Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/voter-vault:latest
            ghcr.io/${{ github.repository_owner }}/voter-vault:${{ github.sha }}

      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/voter-vault-nginx:latest
            ghcr.io/${{ github.repository_owner }}/voter-vault-nginx:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Tank via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            mkdir -p /opt/voterslist
            cd /opt/voterslist

            # 0. Pre-deploy database backup (safety net)
            mkdir -p /opt/voterslist/backups/pre-deploy
            docker compose -f /opt/voterslist/docker-compose.remote.yml exec -T db pg_dump -U ${DB_USER:-admin} -d voter_db --clean --if-exists 2>/dev/null | gzip > /opt/voterslist/backups/pre-deploy/voter_db_pre_deploy_$(date +%Y%m%d_%H%M%S).sql.gz || echo "⚠️ Pre-deploy backup skipped (DB not running yet)"
            # Keep only last 5 pre-deploy backups
            ls -t /opt/voterslist/backups/pre-deploy/*.sql.gz 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true

            # 1. Update logic files (Ensure no local Git conflicts)
            git fetch origin master && git reset --hard origin/master

            # 2. Hard-Locked Pull (CRASH ON FAILURE)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            
            echo "🚀 Verifying Serial Number: $IMAGE_TAG"
            docker compose -f docker-compose.remote.yml pull || (echo "🚨 CRITICAL ERROR: Version $IMAGE_TAG was not found on GitHub. Stopping update to prevent old code use." && exit 1)

            # 3. Nuclear-Cleanup Swap (Prevention of Name Conflicts)
            echo "🧹 Clearing old memory and stubborn containers..."
            # Force-kill known stubborn names
            docker rm -f voterslist-redis-1 voterslist-worker-1 voterslist-app-1 voterslist-nginx-1 voterslist-certbot-1 2>/dev/null || true
            # Nuclear stop (DATA-SAFE: No --volumes flag)
            docker compose -f docker-compose.remote.yml down --remove-orphans --timeout 30 || true
            # Restart with the EXACT commit-SHA image that was just built and pulled
            export IMAGE_TAG=${{ github.sha }}
            echo "🚀 Starting containers with IMAGE_TAG=$IMAGE_TAG"
            docker compose -f docker-compose.remote.yml up -d

            # Fix data directory permissions (non-root container user)
            chmod -R 775 ./data 2>/dev/null || true
            chown -R 1000:1000 ./data 2>/dev/null || true

            # Run Django migrations if needed
            sleep 5
            docker compose -f docker-compose.remote.yml exec -T app python -c "
            import os; os.environ['DJANGO_SETTINGS_MODULE']='voter_vault.settings'
            import django; django.setup()
            from django.core.management import call_command
            call_command('migrate', '--no-input')
            " || echo "⚠️ Migration failed — check manually"

            docker image prune -f

            # 5. Setup daily backup cron (idempotent)
            chmod +x /opt/voterslist/scripts/backup-db.sh 2>/dev/null || true
            chmod +x /opt/voterslist/scripts/restore-db.sh 2>/dev/null || true
            (crontab -l 2>/dev/null | grep -v 'backup-db.sh'; echo "0 2 * * * cd /opt/voterslist && /opt/voterslist/scripts/backup-db.sh >> /opt/voterslist/backups/backup.log 2>&1") | crontab -

            # 6. Verify frontend files are baked into the nginx image
            echo "🔍 Verifying frontend files in nginx container..."
            sleep 5
            VERIFY_FAIL=false
            for f in index.html manifest.json sw.js icons/icon-192.png icons/icon-512.png; do
              if docker compose -f docker-compose.remote.yml exec -T nginx test -f /usr/share/nginx/html/$f 2>/dev/null; then
                echo "   ✅ $f"
              else
                echo "   ❌ $f MISSING"
                VERIFY_FAIL=true
              fi
            done

            if [ "$VERIFY_FAIL" = true ]; then
              echo "🚨 CRITICAL: Some frontend files missing in nginx!"
              echo "   Nginx html dir contents:"
              docker compose -f docker-compose.remote.yml exec -T nginx ls -la /usr/share/nginx/html/ 2>/dev/null || echo "   (empty)"
            fi

            RUNNING_IMAGE=$(docker compose -f docker-compose.remote.yml images app --format json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)[0].get('Tag','unknown'))" 2>/dev/null || echo "unknown")

            # Final smoke test — check if the site returns HTML
            sleep 3
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://intelhub.live/ 2>/dev/null || echo "000")
            echo "   Site HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" != "200" ]; then
                echo "🚨 WARNING: Site returned $HTTP_STATUS — manual verification needed!"
            fi

            echo "✅ Deployed commit ${{ github.sha }}. Running image tag: $RUNNING_IMAGE"

  post-deploy-tests:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install chromium

      - name: Run Production E2E Tests
        run: |
          cd frontend
          TEST_URL=https://intelhub.live npx playwright test e2e/production.spec.js --reporter=list
        env:
          CI: true
