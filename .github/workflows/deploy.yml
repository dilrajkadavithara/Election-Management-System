name: Cloud Deployment Pipeline

on:
  push:
    branches: [ master ]

# Prevent simultaneous deploys. New pushes QUEUE (don't cancel) so the server
# is never left in a half-restarted state from a mid-SSH kill.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Update Code on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p /opt/voterslist
            cd /opt/voterslist
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin master
              git reset --hard origin/master
            fi

      - name: Transfer Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "frontend/dist/**,Paravur_Polling_Stations_list (1).xlsx"
          target: "/opt/voterslist/"
          strip_components: 0

      - name: Start Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            cd /opt/voterslist

            # STEP 1: Build new images while old containers keep serving traffic.
            # This is the slow part (pip install, etc.) — zero downtime during build.
            docker compose build

            # STEP 2: Swap containers with pre-built images — fast, seconds of downtime.
            docker compose up -d --no-build --remove-orphans

            # Prune stopped containers only — preserve image cache for next deploy
            docker container prune -f
            echo "✅ Containers swapped. Health check running from GitHub Actions."

      - name: Verify Deployment Health
        # Polls the live URL and checks for 'healthy' in the response body —
        # more robust than HTTP status alone (a 200 from a bad proxy won't fool this).
        continue-on-error: true
        run: |
          echo "Waiting 60s for Django migrations and uvicorn to finish starting..."
          sleep 60
          echo "Polling https://intelhub.live/api/health (up to 5 minutes)..."
          for i in $(seq 1 20); do
            BODY=$(curl -s https://intelhub.live/api/health 2>/dev/null || echo "")
            echo "  Attempt $i/20: $BODY"
            if echo "$BODY" | grep -q '"healthy"'; then
              echo "🚀 DEPLOYMENT SUCCESSFUL — app is live and genuinely healthy."
              exit 0
            fi
            sleep 15
          done
          echo "⚠️  Health check timed out — site may still be starting up."
          exit 1
