name: Tank Deployment Pipeline (GHCR Optimized)

on:
  push:
    branches: [ master ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/voter-vault:latest
            ghcr.io/${{ github.repository_owner }}/voter-vault:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Tank via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            mkdir -p /opt/voterslist
            cd /opt/voterslist

            # 1. Update logic files (Ensure no local Git conflicts)
            git fetch origin master && git reset --hard origin/master

            # 2. Hard-Locked Pull (CRASH ON FAILURE)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            
            echo "🚀 Verifying Serial Number: $IMAGE_TAG"
            docker compose -f docker-compose.remote.yml pull || (echo "🚨 CRITICAL ERROR: Version $IMAGE_TAG was not found on GitHub. Stopping update to prevent old code use." && exit 1)

            # 3. Nuclear-Cleanup Swap (Prevention of Name Conflicts)
            echo "🧹 Clearing old memory and stubborn containers..."
            # Force-kill known stubborn names
            docker rm -f voterslist-redis-1 voterslist-worker-1 voterslist-app-1 voterslist-nginx-1 voterslist-certbot-1 2>/dev/null || true
            # Nuclear stop (DATA-SAFE: No --volumes flag)
            docker compose -f docker-compose.remote.yml down --remove-orphans --timeout 1 || true
            # Restart with IMAGE_TAG=latest (persisted in .env)
            export IMAGE_TAG=latest
            docker compose -f docker-compose.remote.yml up -d

            # Fix data directory permissions (non-root container user)
            chmod -R 777 ./data 2>/dev/null || true

            # Run Django migrations if needed
            sleep 5
            docker compose -f docker-compose.remote.yml exec -T app python -c "
            import os; os.environ['DJANGO_SETTINGS_MODULE']='voter_vault.settings'
            import django; django.setup()
            from django.core.management import call_command
            call_command('migrate', '--no-input')
            " 2>/dev/null || true

            docker image prune -f

            echo "✅ Deployed. Server running latest image with migrations applied."
