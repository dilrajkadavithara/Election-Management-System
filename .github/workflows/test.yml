name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

  test-backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: voters_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Database/OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libgl1

      - name: Install Backend Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django httpx

      - name: Wait for DB
        run: sleep 5

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgres://postgres:@localhost:5432/voters_db
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: voter_vault.settings
          SECRET_KEY: ci-test-secret-key-minimum-50-chars-long-for-django-validation
          DEBUG: "True"
        run: pytest tests/
