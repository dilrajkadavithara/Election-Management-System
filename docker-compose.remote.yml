version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=voter_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secretpassword
    # Internal usage: admin/secretpassword (production local auth)

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  app:
    image: ghcr.io/dilrajkadavithara/voter-vault:latest
    restart: always
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgres://admin:secretpassword@db:5432/voter_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=voter_vault.settings
      - RUN_MIGRATIONS=True
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Shared volumes to export static files from the build image to Nginx
      - static_volume:/app/frontend/dist
      - backend_static:/app/voter_vault/static
    depends_on:
      - db
      - redis

  worker:
    image: ghcr.io/dilrajkadavithara/voter-vault:latest
    restart: always
    command: celery -A backend.celery_app worker --loglevel=info -P solo --concurrency=20 --max-tasks-per-child=5
    environment:
      - DATABASE_URL=postgres://admin:secretpassword@db:5432/voter_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=voter_vault.settings
      - PYTHONPATH=/app/voter_vault
      - OMP_THREAD_LIMIT=1 
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      # Shared volumes populated by the app container
      - static_volume:/usr/share/nginx/html:ro
      - backend_static:/app/voter_vault/static:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  static_volume:
  backend_static:
