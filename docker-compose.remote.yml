version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=voter_db
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  app:
    image: ghcr.io/dilrajkadavithara/voter-vault:${IMAGE_TAG:?CRITICAL_ERROR_DEPLOYMENT_TAG_MISSING}
    restart: always
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-admin}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/voter_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=voter_vault.settings
      - RUN_MIGRATIONS=True
      - PYTHONPATH=/app:/app/voter_vault

    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # NEW: Robust static export system.
      # Instead of mounting directly to the app paths (which can be masked by stale volumes), 
      # we mount to an export path and let server.py force-sync the image contents on startup.
      - static_volume:/mnt/static_export/frontend
      - backend_static:/mnt/static_export/backend
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:

      - db
      - redis

  worker:
    image: ghcr.io/dilrajkadavithara/voter-vault:${IMAGE_TAG:?CRITICAL_ERROR_DEPLOYMENT_TAG_MISSING}
    restart: always
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=3 --max-tasks-per-child=5 --prefetch-multiplier=1
    environment:
      - DATABASE_URL=postgres://${DB_USER:-admin}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/voter_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=voter_vault.settings
      - PYTHONPATH=/app:/app/voter_vault
      - OMP_THREAD_LIMIT=1 
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      # These volumes are populated by the 'app' container's startup sync logic
      - static_volume:/usr/share/nginx/html:ro
      - backend_static:/app/voter_vault/static:ro
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  static_volume:
  backend_static:
