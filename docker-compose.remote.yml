version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    command: postgres -c max_connections=300 -c shared_buffers=512MB -c work_mem=4MB -c effective_cache_size=1536MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=voter_db
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-intelhub_redis_2026} --maxmemory 400mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  app:
    image: ghcr.io/dilrajkadavithara/voter-vault:${IMAGE_TAG:?CRITICAL_ERROR_DEPLOYMENT_TAG_MISSING}
    restart: always
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-admin}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/voter_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-intelhub_redis_2026}@redis:6379/0
      - DJANGO_SETTINGS_MODULE=voter_vault.settings
      - RUN_MIGRATIONS=True
      - PYTHONPATH=/app:/app/voter_vault

    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Backend static files (Django admin CSS/JS) — synced to nginx via shared volume
      - backend_static:/mnt/static_export/backend
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 4G
    depends_on:
      - db
      - redis

  worker:
    image: ghcr.io/dilrajkadavithara/voter-vault:${IMAGE_TAG:?CRITICAL_ERROR_DEPLOYMENT_TAG_MISSING}
    restart: always
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=5 --max-tasks-per-child=10 --prefetch-multiplier=1
    environment:
      - DATABASE_URL=postgres://${DB_USER:-admin}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/voter_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-intelhub_redis_2026}@redis:6379/0
      - DJANGO_SETTINGS_MODULE=voter_vault.settings
      - PYTHONPATH=/app:/app/voter_vault
      - OMP_THREAD_LIMIT=1 
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '5'
          memory: 8G
    depends_on:
      - db
      - redis

  nginx:
    image: ghcr.io/dilrajkadavithara/voter-vault-nginx:${IMAGE_TAG:?CRITICAL_ERROR_DEPLOYMENT_TAG_MISSING}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      # Backend static files still need the shared volume (Django admin/API docs)
      - backend_static:/app/voter_vault/static:ro
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  backend_static:
