server {
    listen 80;
    server_name intelhub.live www.intelhub.live;
    client_max_body_size 50M;

    # Certbot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name intelhub.live www.intelhub.live;
    client_max_body_size 50M;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/intelhub.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intelhub.live/privkey.pem;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Debug header to verify deployment
    add_header X-Config-Version "v2.2-root-mapping";

    # Static Assets (JS, CSS)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }

    # Backend API Proxy
    location /api {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static Assets for Backend (Images, Symbols)
    location /data {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
