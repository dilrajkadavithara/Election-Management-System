# Rate limiting zones (tuned for 250 concurrent booth agents)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

# Upstream with keepalive connections (avoids per-request TCP handshake)
upstream backend {
    server app:8000;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name intelhub.live www.intelhub.live;
    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name intelhub.live www.intelhub.live;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/intelhub.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intelhub.live/privkey.pem;

    # SSL optimization
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Root directory for all frontend files
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Dynamic Resolver to prevent '502 Bad Gateway' on container restarts
    resolver 127.0.0.11 valid=30s;
    set $upstream_backend "http://backend";

    # Rate-limited auth endpoint
    location /api/token {
        limit_req zone=login burst=10 nodelay;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE: Real-time voting stats stream (must be before /api to match first)
    location /api/voters/voting-stats/stream {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        # No rate limiting — SSE is one long-lived connection per booth agent
    }

    # Backend API Proxy (Prioritized)
    location /api {
        limit_req zone=api burst=150 nodelay;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;

        # Smooth transition during backend restarts
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # "Turbo" Upload settings: Stream large PDFs directly to backend without Nginx buffering
        proxy_request_buffering off;
        proxy_buffering off;

        # Extended timeouts for large PDF uploads and long OCR jobs (300MB+ or 500+ pages)
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    3600s; # 1 hour to support complex extractions & status feeds
    }

    # Secret Admin Proxy (Prioritized)
    location /voter-intel-hq-2026 {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django Static Files (Updated for combined path)
    location /voter-vault-static/ {
        alias /app/voter_vault/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Static Assets for Backend (OCR data etc)
    location /data {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Specific handling for assets to ensure correct MIME types
    location /assets/ {
        include /etc/nginx/mime.types;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NEVER be cached — it references hashed JS/CSS bundles
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Service worker must not be cached to allow PWA updates
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # PWA manifest
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    # Main frontend routing (Catch-all at bottom)
    location / {
        include /etc/nginx/mime.types;
        try_files $uri $uri/ /index.html;
    }
}
