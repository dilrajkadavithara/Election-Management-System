server {
    listen 80;
    server_name intelhub.live www.intelhub.live;
    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name intelhub.live www.intelhub.live;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/intelhub.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intelhub.live/privkey.pem;

    # SSL optimization
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Root directory for all frontend files
    root /usr/share/nginx/html;
    index index.html;

    # Debug header
    add_header X-Config-Version "v4.1-neural-core-fix";

    # Specific handling for assets to ensure correct MIME types
    location /assets/ {
        include /etc/nginx/mime.types;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Main frontend routing (SPA)
    location / {
        include /etc/nginx/mime.types;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static Assets for Backend
    location /data {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
